{% extends "base.html" %}
{% block titulo %}Editar evento{% endblock %}
{% block main_class %}ancho{% endblock %}

{% block contenido %}
    <a href="{{ url_for('calendario') }}" class="volver">&larr; Volver al calendario</a>

    <span class="eyebrow">Editar</span>
    <h1>{{ evento['titulo'] }}</h1>
    <p class="subtitle">Actualiza los datos del evento</p>

    <div class="card">
        <form method="POST" id="formulario-evento">
            <div class="campo">
                <label for="titulo">Titulo</label>
                <input type="text" id="titulo" name="titulo" value="{{ evento['titulo'] }}" required>
            </div>

            <div class="campo">
                <label for="categoria_id">Categoria</label>
                <select id="categoria_id" name="categoria_id">
                    <option value="">Sin categoria</option>
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}" {{ 'selected' if evento['categoria_id'] == cat.id else '' }}>{{ cat.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" name="fecha" value="{{ evento['fecha'] }}" required>
            </div>

            <div class="campo campo-checkbox">
                <input type="checkbox" id="todo_el_dia" name="todo_el_dia" {{ 'checked' if evento['todo_el_dia'] else '' }}>
                <label for="todo_el_dia">Todo el dia (sin hora concreta)</label>
            </div>

            <div class="campo" id="campo-hora" style="display:none;">
                <label for="hora">Hora</label>
                <input type="time" id="hora" name="hora" value="{{ evento['hora'] or '' }}">
            </div>

            <div class="campo">
                <label for="lugar">Lugar (opcional)</label>
                <input type="text" id="lugar" name="lugar" value="{{ evento['lugar'] or '' }}">
            </div>

            <div class="campo">
                <label for="descripcion">Descripcion (opcional)</label>
                <input type="text" id="descripcion" name="descripcion" value="{{ evento['descripcion'] or '' }}">
            </div>

            <div class="campo">
                <label for="recordatorio_dias">Avisar con antelacion (dias)</label>
                <input type="number" id="recordatorio_dias" name="recordatorio_dias" value="{{ evento['recordatorio_dias'] }}" min="0">
            </div>

            <div class="campo">
                <label for="repetir">Repetir</label>
                <select id="repetir" name="repetir">
                    {% for opcion in opciones_repeticion %}
                        <option value="{{ opcion }}" {{ 'selected' if evento['repetir'] == opcion else '' }}>{{ opcion | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo" id="campo-repetir-hasta" style="display:none;">
                <label for="repetir_hasta">Repetir hasta (opcional)</label>
                <input type="date" id="repetir_hasta" name="repetir_hasta" value="{{ evento['repetir_hasta'] or '' }}">
                <p class="tag" style="margin: 6px 0 0;">Si lo dejas en blanco, se repite indefinidamente.</p>
            </div>

            <button type="submit">Guardar cambios</button>
        </form>

        <form method="POST" action="{{ url_for('calendario_eliminar', evento_id=evento['id']) }}"
              style="margin-top:16px;" onsubmit="return confirm('¿Eliminar {{ evento['titulo'] }}?');">
            <button type="submit" class="btn btn-peligro" style="width:100%; margin-top:0;">Eliminar evento</button>
        </form>
    </div>

    <script>
        const casillaTodoElDia = document.getElementById('todo_el_dia');
        const campoHora = document.getElementById('campo-hora');

        function actualizarCampoHora() {
            campoHora.style.display = casillaTodoElDia.checked ? 'none' : 'block';
        }
        casillaTodoElDia.addEventListener('change', actualizarCampoHora);
        actualizarCampoHora();

        const selectRepetir = document.getElementById('repetir');
        const campoRepetirHasta = document.getElementById('campo-repetir-hasta');

        function actualizarCampoRepetirHasta() {
            campoRepetirHasta.style.display = selectRepetir.value === 'ninguna' ? 'none' : 'block';
        }
        selectRepetir.addEventListener('change', actualizarCampoRepetirHasta);
        actualizarCampoRepetirHasta();
    </script>
{% endblock %}
