{% extends "base.html" %}
{% block titulo %}Editar categoria{% endblock %}
{% block main_class %}ancho{% endblock %}

{% block contenido %}
    <a href="{{ url_for('calendario_categorias') }}" class="volver">&larr; Volver a categorias</a>

    <span class="eyebrow">Editar</span>
    <h1>{{ categoria['nombre'] }}</h1>

    <div class="card">
        <form method="POST">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="{{ categoria['nombre'] }}" required>
            </div>
            <div class="campo">
                <label>Color</label>
                <div class="selector-colores">
                    {% for color in colores %}
                        <span class="opcion-color">
                            <input type="radio" name="color" id="color-{{ color }}" value="{{ color }}" {{ 'checked' if categoria['color'] == color else '' }}>
                            <label for="color-{{ color }}" class="swatch cat-{{ color }}"></label>
                        </span>
                    {% endfor %}
                </div>
            </div>
            <button type="submit">Guardar cambios</button>
        </form>
    </div>
{% endblock %}
