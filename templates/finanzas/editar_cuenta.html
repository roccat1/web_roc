{% extends "base.html" %}
{% block titulo %}Editar cuenta{% endblock %}
{% block main_class %}ancho{% endblock %}

{% block contenido %}
    <a href="{{ url_for('finanzas_cuentas') }}" class="volver">&larr; Volver a cuentas</a>

    <span class="eyebrow">Editar</span>
    <h1>{{ cuenta['nombre'] }}</h1>

    <div class="card">
        <form method="POST">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="{{ cuenta['nombre'] }}" required>
            </div>
            <div class="campo">
                <label for="saldo">Saldo (€)</label>
                <input type="number" id="saldo" name="saldo" step="0.01" value="{{ cuenta['saldo'] }}" required>
            </div>
            <div class="campo">
                <label for="es_ahorro" style="display:flex; align-items:center; gap:6px; font-weight:normal;">
                    <input type="checkbox" id="es_ahorro" name="es_ahorro" style="width:auto;" {{ 'checked' if cuenta['es_ahorro'] else '' }}>
                    Cuenta de ahorros (aparte del saldo total)
                </label>
            </div>
            <button type="submit">Guardar cambios</button>
        </form>
    </div>
{% endblock %}
