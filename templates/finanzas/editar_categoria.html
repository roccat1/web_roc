{% extends "base.html" %}
{% block titulo %}Editar categoria{% endblock %}
{% block main_class %}ancho{% endblock %}

{% block contenido %}
    <a href="{{ url_for('finanzas_categorias') }}" class="volver">&larr; Tornar a categories</a>

    <span class="eyebrow">Editar</span>
    <h1>{{ categoria['nombre'] }}</h1>

    <div class="card">
        <form method="POST">
            <div class="campo">
                <label for="nombre">Nom</label>
                <input type="text" id="nombre" name="nombre" value="{{ categoria['nombre'] }}" required>
            </div>
            <div class="campo">
                <label for="tipo">Tipus</label>
                <select id="tipo" name="tipo">
                    <option value="gasto" {{ 'selected' if categoria['tipo'] == 'gasto' else '' }}>Despesa</option>
                    <option value="ingreso" {{ 'selected' if categoria['tipo'] == 'ingreso' else '' }}>Ingres</option>
                </select>
            </div>
            <button type="submit">Desar els canvis</button>
        </form>
    </div>
{% endblock %}
