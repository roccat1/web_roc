{% extends "base.html" %}
{% block titulo %}Editar operacio{% endblock %}
{% block main_class %}ancho{% endblock %}

{% block contenido %}
    <a href="{{ url_for('finanzas_operaciones') }}" class="volver">&larr; Tornar a l'historial</a>

    <span class="eyebrow">Editar</span>
    <h1>Operacio</h1>
    <p class="subtitle">Canvia el que calgui; el saldo dels comptes s'ajusta sol</p>

    <div class="card">
        <form method="POST" id="formulario-operacion">
            <input type="hidden" name="origen" value="{{ origen }}">
            <div class="campo">
                <label for="tipo">Tipus d'operacio</label>
                <select id="tipo" name="tipo" required>
                    <option value="gasto" {{ 'selected' if operacion['tipo'] == 'gasto' else '' }}>Despesa</option>
                    <option value="ingreso" {{ 'selected' if operacion['tipo'] == 'ingreso' else '' }}>Ingres</option>
                    <option value="transferencia" {{ 'selected' if operacion['tipo'] == 'transferencia' else '' }}>Transferencia entre comptes</option>
                </select>
            </div>

            <div class="campo">
                <label id="etiqueta-cuenta" for="cuenta_id">Compte</label>
                <select id="cuenta_id" name="cuenta_id" required>
                    {% for cuenta in cuentas %}
                        <option value="{{ cuenta['id'] }}" {{ 'selected' if cuenta['id'] == operacion['cuenta_id'] else '' }}>{{ cuenta['nombre'] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo" id="campo-destino" style="display:none;">
                <label for="cuenta_destino_id">Compte desti</label>
                <select id="cuenta_destino_id" name="cuenta_destino_id">
                    {% for cuenta in cuentas %}
                        <option value="{{ cuenta['id'] }}" {{ 'selected' if cuenta['id'] == operacion['cuenta_destino_id'] else '' }}>{{ cuenta['nombre'] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo" id="campo-categoria">
                <label for="categoria_id">Categoria</label>
                <select id="categoria_id" name="categoria_id"></select>
            </div>

            <div class="campo" id="campo-subcategoria">
                <label for="subcategoria_id">Subcategoria</label>
                <select id="subcategoria_id" name="subcategoria_id"></select>
            </div>

            <div class="campo">
                <label for="monto">Import (€)</label>
                <input type="number" id="monto" name="monto" step="0.01" min="0.01" value="{{ operacion['monto'] }}" required>
            </div>

            <div class="campo">
                <label for="fecha">Data</label>
                <input type="date" id="fecha" name="fecha" value="{{ operacion['fecha'] }}" required>
            </div>

            <div class="campo">
                <label for="descripcion">Descripcio (opcional)</label>
                <input type="text" id="descripcion" name="descripcion" value="{{ operacion['descripcion'] or '' }}">
            </div>

            <button type="submit">Desar els canvis</button>
        </form>
    </div>

    <script>
        // Categories de l'usuari (amb les seves subcategories) i els valors
        // que tenia guardats aquesta operacio, per deixar-los ja seleccionats.
        const categorias = {{ categorias | tojson }};
        const categoriaActual = {{ operacion['categoria_id'] | tojson }};
        const subcategoriaActual = {{ operacion['subcategoria_id'] | tojson }};

        const selectTipo = document.getElementById('tipo');
        const etiquetaCuenta = document.getElementById('etiqueta-cuenta');
        const campoDestino = document.getElementById('campo-destino');
        const selectDestino = document.getElementById('cuenta_destino_id');
        const campoCategoria = document.getElementById('campo-categoria');
        const selectCategoria = document.getElementById('categoria_id');
        const campoSubcategoria = document.getElementById('campo-subcategoria');
        const selectSubcategoria = document.getElementById('subcategoria_id');

        function actualizarCategorias(mantenerSeleccion) {
            const tipo = selectTipo.value;
            selectCategoria.innerHTML = '';

            if (tipo === 'transferencia') {
                campoCategoria.style.display = 'none';
                campoSubcategoria.style.display = 'none';
                campoDestino.style.display = 'block';
                etiquetaCuenta.textContent = 'Compte origen';
                selectCategoria.required = false;
                selectSubcategoria.required = false;
                selectDestino.required = true;
            } else {
                campoCategoria.style.display = 'block';
                campoSubcategoria.style.display = 'block';
                campoDestino.style.display = 'none';
                etiquetaCuenta.textContent = 'Compte';
                selectCategoria.required = true;
                selectSubcategoria.required = true;
                selectDestino.required = false;

                categorias
                    .filter(cat => cat.tipo === tipo)
                    .forEach(cat => {
                        const opcion = document.createElement('option');
                        opcion.value = cat.id;
                        opcion.textContent = cat.nombre;
                        selectCategoria.appendChild(opcion);
                    });

                if (mantenerSeleccion && categoriaActual) {
                    selectCategoria.value = categoriaActual;
                }
                actualizarSubcategorias(mantenerSeleccion);
            }
        }

        function actualizarSubcategorias(mantenerSeleccion) {
            selectSubcategoria.innerHTML = '';
            const categoriaId = parseInt(selectCategoria.value, 10);
            const categoria = categorias.find(cat => cat.id === categoriaId);

            if (categoria) {
                categoria.subcategorias.forEach(sub => {
                    const opcion = document.createElement('option');
                    opcion.value = sub.id;
                    opcion.textContent = sub.nombre;
                    selectSubcategoria.appendChild(opcion);
                });
            }

            if (mantenerSeleccion && subcategoriaActual) {
                selectSubcategoria.value = subcategoriaActual;
            }
        }

        selectTipo.addEventListener('change', () => actualizarCategorias(false));
        selectCategoria.addEventListener('change', () => actualizarSubcategorias(false));

        // Estat inicial en carregar la pagina: deixem seleccionades la
        // categoria i la subcategoria que ja tenia guardades l'operacio.
        actualizarCategorias(true);
    </script>
{% endblock %}
