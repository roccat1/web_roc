{% extends "base.html" %}
{% block titulo %}Iniciar sessio{% endblock %}

{% block contenido %}
    <div class="pin-row">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <span class="eyebrow">Acces</span>
    <h1>Iniciar sessio</h1>
    <p class="subtitle">Entra amb el teu usuari i contrasenya</p>

    <div class="card">
        <form method="POST">
            <div class="campo">
                <label for="username">Usuari</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="campo">
                <label for="password">Contrasenya</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

    <p class="ayuda">Si no tens compte, <a href="{{ url_for('registro') }}">registra't aqui</a>.</p>
{% endblock %}
